<!DOCTYPE html>
<html>
<head>
    <title>Basic VR Experience</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

    <script>
        AFRAME.registerComponent('toggle-animation', {
            init: function () {
                let isPlaying = true;
                const model = document.querySelector('#aceModel');

                this.el.addEventListener('click', () => {
                    const mixer = model.components['animation-mixer'];

                    if (!mixer) return;

                    isPlaying = !isPlaying;

                    if (isPlaying) {
                        mixer.play();
                        this.el.querySelector('a-text')
                            .setAttribute('value', 'Pause');
                    } else {
                        mixer.pause();
                        this.el.querySelector('a-text')
                            .setAttribute('value', 'Play');
                    }
                });
            }
        });
    </script>
</head>

<body>
    <a-scene>

        <!-- Assets -->
        <a-assets>
            <img id="blood-cell-bg" src="red-blood-cells.jpg">
            <a-asset-item id="ACE-model"
                src="https://pub-44eeecbb3572422d95761ec4fea50bbf.r2.dev/hala.glb">
            </a-asset-item>
        </a-assets>

        <!-- Camera Rig -->
        <a-entity id="rig" position="0 0 0" movement-controls="speed: 2; fly: false">

            <!-- Camera -->
            <a-entity camera position="0 1.6 0" look-controls>

                <!-- ✅ Button (bottom-left) -->
                <a-plane 
                    position="-0.6 -0.5 -1"
                    width="0.4"
                    height="0.2"
                    color="#222"
                    class="clickable"
                    toggle-animation>

                    <a-text 
                        value="Pause"
                        align="center"
                        position="0 0 0.01"
                        scale="0.35 0.35 0.35"
                        color="white">
                    </a-text>

                </a-plane>

            </a-entity>

            <!-- Controllers -->
            <a-entity laser-controls="hand: left" raycaster="objects: .clickable"></a-entity>
            <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>

        </a-entity>

        <!-- Environment -->
        <a-sphere 
            src="#blood-cell-bg"
            radius="500"
            scale="-1 1 1"
            material="side: back">
        </a-sphere>

        <!-- Lighting -->
        <a-light type="ambient" intensity="0.5"></a-light>
        <a-light type="directional" intensity="0.8" position="5 10 3"></a-light>

        <!-- Ground -->
        <a-plane 
            position="0 -0.1 0"
            rotation="-90 0 0"
            width="100"
            height="100"
            material="opacity: 0"
            class="clickable">
        </a-plane>

        <!-- ✅ Model WITH built-in animation -->
        <a-entity 
            id="aceModel"
            gltf-model="#ACE-model"
            animation-mixer
            position="0 0 -3"
            scale="1 1 1"
            class="clickable">
        </a-entity>

    </a-scene>
</body>
</html>
