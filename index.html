<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VR Scene</title>

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  </head>

  <body>
    <a-scene vr-mode-ui="enabled: true">

      <!-- 🧠 PLAYER RIG (THIS is what moves in VR) -->
      <a-entity 
        id="rig"
        position="-134.113 65.134 114.640"
        movement-controls="speed: 0.2">

        <!-- 👁 Camera (HEAD ONLY — DO NOT MOVE IT FOR VR) -->
        <a-entity
          camera
          position="0 0 0"
          look-controls
          cursor="rayOrigin: mouse">
        </a-entity>

        <!-- 🎮 LEFT CONTROLLER -->
        <a-entity
          laser-controls="hand: left"
          raycaster="objects: .clickable"
          teleport-controls="cameraRig: #rig; teleportOrigin: #rig;">
        </a-entity>

        <!-- 🎮 RIGHT CONTROLLER -->
        <a-entity
          laser-controls="hand: right"
          raycaster="objects: .clickable"
          teleport-controls="cameraRig: #rig; teleportOrigin: #rig;">
        </a-entity>

      </a-entity>

      <!-- 🟩 Invisible Floor (required for teleport) -->
      <a-plane 
        position="-113.996 0 0"
        rotation="0 0 0"
        width="500"
        height="100"
        material="opacity: 0; transparent: true">
        > 

      <!-- 🎯 MODEL -->
      <a-entity
        id="ace-model"
        class="clickable"
        gltf-model="url(https://pub-44eeecbb3572422d95761ec4fea50bbf.r2.dev/hala.glb)"
        position="0 1 -3"
        scale="1 1 1">
      </a-entity>

      <!-- 🌌 SKY -->
      <a-sky src="red-blood-cells.jpg"></a-sky>

    </a-scene>

    <script>
      window.addEventListener('load', () => {
        const model = document.getElementById('ace-model');

        // ▶️ Start animation ONLY on click
        model.addEventListener('click', () => {
          console.log('▶️ Animation started');

          model.setAttribute('animation-mixer', {
            timeScale: 1,
            loop: 'repeat'
          });
        });

        model.addEventListener('model-loaded', () => {
          console.log('✅ Model loaded');
        });

        model.addEventListener('model-error', (e) => {
          console.error('❌ Error loading model:', e.detail);
        });

        console.log('🎮 VR Ready (Meta Quest)');
      });
    </script>

  </body>
</html>
