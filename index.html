<!DOCTYPE html>
<html>
<head>
    <title>Basic VR Experience</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.js"></script>
    <script>
        // Safe movement - attached directly without external libraries
        AFRAME.registerComponent('thumb-move', {
            init: function() {
                this.rig = this.el;
                this.speed = 2;
                this.moveVec = new THREE.Vector3();
                
                // Listen without breaking WebXR
                this.el.sceneEl.addEventListener('axismove', (e) => {
                    try {
                        if (!this.el.sceneEl.is('vr-mode')) return;
                        
                        const controller = e.target;
                        const handedness = controller.components['laser-controls']?.data?.hand;
                        const axes = e.detail.axis;
                        
                        if (handedness === 'left' && axes && axes.length > 1) {
                            const x = axes[0];
                            const z = axes[1];
                            
                            if (Math.abs(x) > 0.2 || Math.abs(z) > 0.2) {
                                const camera = this.el.querySelector('[camera]');
                                if (!camera) return;
                                
                                const cameraDir = camera.object3D.getWorldDirection(this.moveVec);
                                cameraDir.y = 0;
                                cameraDir.normalize();
                                
                                const right = new THREE.Vector3().crossVectors(cameraDir, new THREE.Vector3(0, 1, 0));
                                
                                let dx = 0, dz = 0;
                                if (Math.abs(z) > 0.2) {
                                    dx -= cameraDir.x * z;
                                    dz -= cameraDir.z * z;
                                }
                                if (Math.abs(x) > 0.2) {
                                    dx -= right.x * x;
                                    dz -= right.z * x;
                                }
                                
                                this.rig.object3D.position.x += dx * this.speed * 0.016;
                                this.rig.object3D.position.z += dz * this.speed * 0.016;
                            }
                        }
                    } catch(err) {
                        // Silent fail - don't crash WebXR
                        console.log('Movement error caught safely');
                    }
                });
            }
        });
    </script>
</head>
<body>
    <a-scene>
        <a-assets>
            <img id="blood-cell-bg" src="red-blood-cells.jpg">
            <a-asset-item id="ACE-model" src="https://pub-44eeecbb3572422d95761ec4fea50bbf.r2.dev/hala.glb"></a-asset-item>
        </a-assets>
        
        <a-entity id="rig" thumb-move position="0 0 0">
            <a-entity camera position="0 1.6 0" look-controls></a-entity>
            <a-entity laser-controls="hand: left"></a-entity>
            <a-entity laser-controls="hand: right"></a-entity>
        </a-entity>
        
        <a-sphere src="#blood-cell-bg" radius="500" scale="-1 1 1" material="side: back"></a-sphere>
        
        <a-light type="ambient" intensity="0.5"></a-light>
        <a-light type="directional" intensity="0.8" position="5 10 3"></a-light>
        
        <a-entity gltf-model="#ACE-model" position="0 0 -3"></a-entity>
    </a-scene>
</body>
</html>
