<!DOCTYPE html>
<html>
<head>
    <title>Basic VR Experience</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.js"></script>
    <script>
        // Working movement component
        AFRAME.registerComponent('thumb-move', {
            init: function() {
                this.rig = this.el;
                this.speed = 2;
                this.moveVec = new THREE.Vector3();
                
                // Store reference to this component for event handler
                const self = this;
                
                // Listen for controller movements
                window.addEventListener('axismove', function(e) {
                    try {
                        const scene = document.querySelector('a-scene');
                        if (!scene || !scene.is('vr-mode')) return;
                        
                        const controller = e.target;
                        // Check if this is a controller with laser-controls
                        if (!controller.components || !controller.components['laser-controls']) return;
                        
                        const handedness = controller.components['laser-controls'].data.hand;
                        const axes = e.detail.axis;
                        
                        // Only left controller moves
                        if (handedness === 'left' && axes && axes.length >= 2) {
                            const x = axes[0];
                            const z = axes[1];
                            const deadZone = 0.15;
                            
                            if (Math.abs(x) > deadZone || Math.abs(z) > deadZone) {
                                // Get camera direction
                                const camera = self.rig.querySelector('[camera]');
                                if (!camera) return;
                                
                                const cameraDir = camera.object3D.getWorldDirection(self.moveVec);
                                cameraDir.y = 0;
                                cameraDir.normalize();
                                
                                // Calculate right vector (perpendicular to camera direction)
                                const right = new THREE.Vector3().crossVectors(cameraDir, new THREE.Vector3(0, 1, 0));
                                
                                let dx = 0, dz = 0;
                                
                                // Forward/backward movement (Z axis on thumbstick)
                                if (Math.abs(z) > deadZone) {
                                    dx -= cameraDir.x * -z;
                                    dz -= cameraDir.z * -z;
                                }
                                
                                // Left/right strafe (X axis on thumbstick)
                                if (Math.abs(x) > deadZone) {
                                    dx -= right.x * x;
                                    dz -= right.z * x;
                                }
                                
                                // Apply movement
                                self.rig.object3D.position.x += dx * self.speed * 0.016;
                                self.rig.object3D.position.z += dz * self.speed * 0.016;
                            }
                        }
                    } catch(err) {
                        // Silent fail
                        console.log('Movement error:', err.message);
                    }
                });
            }
        });
    </script>
</head>
<body>
    <a-scene>
        <a-assets>
            <img id="blood-cell-bg" src="red-blood-cells.jpg">
            <a-asset-item id="ACE-model" src="https://pub-44eeecbb3572422d95761ec4fea50bbf.r2.dev/hala.glb"></a-asset-item>
        </a-assets>
        
        <!-- Rig with movement component -->
        <a-entity id="rig" thumb-move position="0 0 0">
            <!-- Camera -->
            <a-entity camera position="0 1.6 0" look-controls></a-entity>
            
            <!-- Left Controller -->
            <a-entity id="left-control" laser-controls="hand: left"></a-entity>
            
            <!-- Right Controller -->
            <a-entity id="right-control" laser-controls="hand: right"></a-entity>
        </a-entity>
        
        <!-- Environment -->
        <a-sphere src="#blood-cell-bg" radius="500" scale="-1 1 1" material="side: back" position="0 0 0"></a-sphere>
        
        <!-- Lighting -->
        <a-light type="ambient" intensity="0.5"></a-light>
        <a-light type="directional" intensity="0.8" position="5 10 3"></a-light>
        
        <!-- ACE Model -->
        <a-entity gltf-model="#ACE-model" position="0 0 -3" scale="1 1 1"></a-entity>
        
        <!-- Simple floor to help with orientation -->
        <a-plane position="0 -0.1 0" rotation="-90 0 0" width="50" height="50" color="#333333" opacity="0.3"></a-plane>
    </a-scene>
</body>
</html>
