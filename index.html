<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VR Scene</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  </head>

  <body>
    <!-- Scene -->
    <a-scene vr-mode-ui="enabled: true">

      <!-- 🔥 Camera Rig (Movement + VR) -->
      <a-entity id="rig" movement-controls="speed: 0.2">

        <!-- Camera -->
        <a-entity 
          camera 
          position="-134.113 65.134 114.640"
          look-controls
          wasd-controls="acceleration: 50"
          cursor="rayOrigin: mouse">
        </a-entity>

        <!-- Left Controller -->
        <a-entity 
          laser-controls="hand: left"
          raycaster="objects: .clickable"
          teleport-controls="cameraRig: #rig; teleportOrigin: #rig;">
        </a-entity>

        <!-- Right Controller -->
        <a-entity 
          laser-controls="hand: right"
          raycaster="objects: .clickable"
          teleport-controls="cameraRig: #rig; teleportOrigin: #rig;">
        </a-entity>

      </a-entity>

      <!-- 🟩 Floor -->
      <a-plane 
        position="-113.996 0 0"
        rotation="-90 0 0"
        width="500"
        height="100" 
        >
      </a-plane>

      <!-- 🎯 3D Model (Clickable) -->
      <a-entity 
        id="ace-model"
        class="clickable"
        gltf-model="url(https://pub-44eeecbb3572422d95761ec4fea50bbf.r2.dev/hala.glb)"
        position="0 1 -3"
        scale="1 1 1">
      </a-entity>

      <!-- Sky -->
      <a-sky id="sky-image" src="red-blood-cells.jpg"></a-sky>

    </a-scene>

    <script>
      window.addEventListener('load', () => {
        const model = document.getElementById('ace-model');

        if (model) {

          // Start animation ONLY when clicked
          model.addEventListener('click', () => {
            console.log('▶️ Animation started');

            model.setAttribute('animation-mixer', {
              timeScale: 1,
              loop: 'repeat'
            });
          });

          model.addEventListener('model-loaded', () => {
            console.log('✅ Model loaded');
          });

          model.addEventListener('model-error', (e) => {
            console.error('❌ Error loading model:', e.detail);
          });
        }

        console.log('🎮 VR Ready (Meta Quest)');
      });
    </script>
  </body>
</html>
