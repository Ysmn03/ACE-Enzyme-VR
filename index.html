<!DOCTYPE html>
<html>
<head>
    <title>Basic VR Experience</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.js"></script>
</head>
<body>
    <a-scene>
        
        <!-- Assets -->
        <a-assets>
            <img id="blood-cell-bg" src="red-blood-cells.jpg">
            <a-asset-item id="ACE-model" src="https://pub-44eeecbb3572422d95761ec4fea50bbf.r2.dev/hala.glb"></a-asset-item>
        </a-assets>
        
        <!-- Camera Rig -->
        <a-entity id="rig" position="0 0 0">
            <a-entity camera position="0 1.6 0" look-controls></a-entity>
            
            <!-- Left Controller with Movement -->
            <a-entity id="left-controller" laser-controls="hand: left"></a-entity>
            
            <!-- Right Controller -->
            <a-entity laser-controls="hand: right"></a-entity>
        </a-entity>
        
        <!-- Environment -->
        <a-sphere src="#blood-cell-bg" radius="500" scale="-1 1 1" material="side: back" position="0 0 0"></a-sphere>
        
        <!-- Lighting -->
        <a-light type="ambient" intensity="0.5"></a-light>
        <a-light type="directional" intensity="0.8" position="5 10 3"></a-light>
        
        <!-- ACE 3D Model -->
        <a-entity gltf-model="#ACE-model" position="0 0 -3" scale="1 1 1"></a-entity>
        
    </a-scene>
    
    <script>
        // Simple thumbstick movement without aframe-extras
        AFRAME.registerComponent('simple-movement', {
            init: function() {
                this.rig = document.getElementById('rig');
                this.camera = this.rig.querySelector('[camera]');
                this.moveVector = new THREE.Vector3();
                
                window.addEventListener('axismove', (e) => {
                    if (!this.rig.sceneEl.is('vr-mode')) return;
                    
                    const controller = e.target;
                    const hand = controller.components['laser-controls']?.data?.hand;
                    const axes = e.detail.axis;
                    
                    // Left controller movement
                    if (hand === 'left' && axes.length >= 2) {
                        const x = axes[0];
                        const z = axes[1];
                        const deadZone = 0.15;
                        
                        if (Math.abs(x) > deadZone || Math.abs(z) > deadZone) {
                            // Get camera direction
                            const direction = this.camera.object3D.getWorldDirection(this.moveVector);
                            direction.y = 0;
                            direction.normalize();
                            
                            // Calculate right vector
                            const right = new THREE.Vector3().crossVectors(direction, new THREE.Vector3(0, 1, 0));
                            
                            // Apply movement
                            const speed = 3;
                            let moveX = 0;
                            let moveZ = 0;
                            
                            if (Math.abs(z) > deadZone) {
                                moveX -= direction.x * z * speed * 0.016;
                                moveZ -= direction.z * z * speed * 0.016;
                            }
                            if (Math.abs(x) > deadZone) {
                                moveX -= right.x * x * speed * 0.016;
                                moveZ -= right.z * x * speed * 0.016;
                            }
                            
                            this.rig.object3D.position.x += moveX;
                            this.rig.object3D.position.z += moveZ;
                        }
                    }
                });
            }
        });
        
        // Add movement to scene
        document.querySelector('a-scene').setAttribute('simple-movement', '');
    </script>
</body>
</html>
