<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VR Scene</title>

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  </head>

  <body>
    <a-scene vr-mode-ui="enabled: true">

      <!-- 🧠 PLAYER RIG -->
      <a-entity
        id="rig"
        position="-134.113 65.134 114.640"
        movement-controls="speed: 0.2"
        wasd-controls="acceleration: 50">

        <!-- 👁 CAMERA -->
        <a-entity
          camera
          position="0 0 0"
          look-controls
          cursor="rayOrigin: mouse">
        </a-entity>

        <!-- 🎛 VR UI (always in front of player) -->
        <a-entity position="90 90 0">

          <!-- Button -->
          <a-box
            id="animButton"
            class="clickable"
            position="0 0 0"
            depth="0.1"
            height="0.25"
            width="0.6"
            color="#4CC3D9">
          </a-box>

          <!-- Label -->
          <a-text
            value="Play / Pause"
            align="center"
            position="0 0.4 0"
            color="#000">
          </a-text>

        </a-entity>

        <!-- 🎮 LEFT CONTROLLER -->
        <a-entity
          laser-controls="hand: left"
          raycaster="objects: .clickable"
          teleport-controls="cameraRig: #rig; teleportOrigin: #rig;">
        </a-entity>

        <!-- 🎮 RIGHT CONTROLLER -->
        <a-entity
          laser-controls="hand: right"
          raycaster="objects: .clickable"
          teleport-controls="cameraRig: #rig; teleportOrigin: #rig;">
        </a-entity>

      </a-entity>

      <!-- 🟩 TELEPORT FLOOR -->
      <a-plane
        position="-134.113 0 114.640"
        rotation="-90 0 0"
        width="500"
        height="100"
        material="opacity: 0; transparent: true">
      </a-plane>

      <!-- 🎯 MODEL -->
      <a-entity
        id="ace-model"
        class="clickable"
        gltf-model="url(https://pub-44eeecbb3572422d95761ec4fea50bbf.r2.dev/hala.glb)"
        position="0 1 -3"
        scale="1 1 1">
      </a-entity>

      <!-- 🌌 SKY -->
      <a-sky src="red-blood-cells.jpg"></a-sky>

    </a-scene>

    <script>
      window.addEventListener('load', () => {
        const model = document.getElementById('ace-model');
        const button = document.getElementById('animButton');

        let playing = false;

        // Initialize paused animation
        model.setAttribute('animation-mixer', {
          timeScale: 0,
          loop: 'repeat'
        });

        // 🎮 Button toggle
        button.addEventListener('click', () => {
          playing = !playing;

          if (playing) {
            console.log('▶️ Play animation');
            model.setAttribute('animation-mixer', {
              timeScale: 1,
              loop: 'repeat'
            });
            button.setAttribute('color', '#00FF88');
          } else {
            console.log('⏸ Pause animation');
            model.setAttribute('animation-mixer', {
              timeScale: 0
            });
            button.setAttribute('color', '#4CC3D9');
          }
        });

        model.addEventListener('model-loaded', () => {
          console.log('✅ Model loaded');
        });

        model.addEventListener('model-error', (e) => {
          console.error('❌ Model error:', e.detail);
        });

        console.log('🎮 VR Ready (Desktop + Meta Quest)');
      });
    </script>

  </body>
</html>
